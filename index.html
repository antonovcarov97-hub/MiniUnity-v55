$('btn-play').onclick = () => { 
    if (isPlaying) return;
    isPlaying = true; 
    transformControls.detach(); 
    gridHelper.visible = false;
    $('unity-toolbar').style.display = 'none';
    $('ui-layer').classList.add('show-ui');
    $('crosshair').classList.add('show');
    $('status-mode').textContent = 'Режим: Игра';
    if (spawnPoint) spawnPoint.mesh.visible = false;
    if (activePlayer && spawnPoint) {
        const spawnY = spawnPoint.mesh.position.y + 1.5; 
        activePlayer.body.position.set(spawnPoint.mesh.position.x, spawnY, spawnPoint.mesh.position.z);
        activePlayer.mesh.position.set(spawnPoint.mesh.position.x, spawnY, spawnPoint.mesh.position.z);
        activePlayer.body.velocity.set(0,0,0);
        activePlayer.body.angularVelocity.set(0,0,0);
        activePlayer.coyote = 0;
    }
    if (mainSceneCamera) activeCamera = mainSceneCamera.cam;
    else if (activePlayer) { activeCamera = camera; activePlayer.canJump = false; }
    savedStates = objects.filter(o => !o.isUI && o.type !== 'camera' && o.type !== 'light' && o.type !== 'spawn' && o.type !== 'wind').map(o => ({ 
        obj: o, pos: o.mesh.position.clone(), quat: o.mesh.quaternion.clone()
    }));
    if(activePlayer) { activePlayer.holding = null; renderer.domElement.requestPointerLock(); }
};

$('btn-stop').onclick = () => { 
    if (!isPlaying) return;
    isPlaying = false; 
    transformControls.enabled = true; 
    gridHelper.visible = true;
    $('unity-toolbar').style.display = 'flex';
    $('ui-layer').classList.remove('show-ui');
    $('crosshair').classList.remove('show');
    $('status-mode').textContent = photonConnected ? 'Режим: MP' : 'Режим: Редактор';
    if (spawnPoint) spawnPoint.mesh.visible = true;
    if(document.pointerLockElement) document.exitPointerLock(); 
    activeCamera = camera;
    camera.position.set(8,6,12); camYaw = -0.8; camPitch = -0.4; 
    if (activePlayer && activePlayer.holding) {
        const o = activePlayer.holding;
        if (o.body) { o.body.mass = o.originalMass ?? 1; o.body.updateMassProperties(); o.body.type = CANNON.Body.DYNAMIC; }
        if (o.mesh.material) o.mesh.material.emissive = new THREE.Color(0x000000);
        activePlayer.holding = null;
    }
    savedStates.forEach(s => {
        s.obj.mesh.position.copy(s.pos); s.obj.mesh.quaternion.copy(s.quat);
        if (s.obj.body) { s.obj.body.position.copy(s.pos); s.obj.body.quaternion.copy(s.quat); s.obj.body.velocity.set(0,0,0); s.obj.body.angularVelocity.set(0,0,0); }
    });
};

document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => addObject(b.dataset.add));

document.addEventListener('keydown', e => { 
    if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT') return; 
    if(e.code === 'Delete' && selectedObjects.length > 0) { selectedObjects.forEach(o => removeObject(o)); }
    if(activePlayer && isPlaying) {
        activePlayer.keys[e.code] = true; 
        if(e.code==='Space') tryJump(activePlayer);
        if(e.code==='KeyE') tryGrab(activePlayer);
    }
});
document.addEventListener('keyup', e => { if(activePlayer) activePlayer.keys[e.code] = false; });
document.addEventListener('mousemove', e => { 
    if(!isPlaying || !activePlayer || document.pointerLockElement !== renderer.domElement) return; 
    activePlayer.yaw -= e.movementX * 0.0022; activePlayer.pitch -= e.movementY * 0.0022; 
    activePlayer.pitch = Math.max(-1.5, Math.min(1.5, activePlayer.pitch)); 
});

const _tmpVec = new THREE.Vector3();
const _zero = new CANNON.Vec3(0, 0, 0);
function applyWindEditor() {
    const windObjs = objects.filter(o => o.type === 'wind');
    if (windObjs.length === 0) return;
    for (const w of windObjs) {
        const size = new THREE.Vector3(5, 5, 5).multiply(w.mesh.scale);
        const box = new THREE.Box3().setFromCenterAndSize(w.mesh.position, size);
        const force = new CANNON.Vec3(w.windDir.x * w.windForce, w.windDir.y * w.windForce, w.windDir.z * w.windForce);
        for (const target of objects) {
            if (!target.body || target.physics !== 'dynamic') continue;
            if (target.isPlayer) continue;
            if (activePlayer && activePlayer.holding === target) continue;
            _tmpVec.set(target.body.position.x, target.body.position.y, target.body.position.z);
            if (box.containsPoint(_tmpVec)) {
                const v = target.body.velocity;
                if (Math.hypot(v.x, v.z) < MAX_WIND_SPEED) target.body.applyForce(force, _zero);
            }
        }
        if (activePlayer) {
            const bp = activePlayer.body.position;
            _tmpVec.set(bp.x, bp.y, bp.z);
            if (box.containsPoint(_tmpVec)) {
                const v = activePlayer.body.velocity;
                if (Math.hypot(v.x, v.z) < MAX_WIND_SPEED) activePlayer.body.applyForce(force, _zero);
            }
        }
    }
}

const clock = new THREE.Clock();
let broadcastTimer = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  
  if(isPlaying){
    if (activePlayer) updatePlayerMovement(activePlayer, dt);
    world.step(Math.min(dt, MAX_PHYSICS_DT));
    applyWindEditor();
    if (activePlayer) { updateGrounded(activePlayer, dt); updateHeld(activePlayer, dt); }
    applyBehaviors(dt);
    objects.forEach(o => { 
        if(o.body && o.physics === 'dynamic' && !o.isPlayer){ 
            o.mesh.position.copy(o.body.position); 
            o.mesh.quaternion.copy(o.body.quaternion); 
        }
        if (o.body && activePlayer && activePlayer.holding === o) { 
            o.mesh.position.copy(o.body.position); 
            o.mesh.quaternion.copy(o.body.quaternion); 
        }
    });
    
    // Обновление удалённых игроков
    Object.values(remotePlayers).forEach(rp => {
        rp.mesh.position.lerp(rp.targetPos, 0.2);
    });
    
    // Broadcast Photon
    if (photonConnected) {
        broadcastTimer += dt;
        if (broadcastTimer > 0.05) {
            broadcastTimer = 0;
            broadcastPlayerState();
        }
    }
    
    if(activePlayer) {
        const p = activePlayer;
        const lookDir = getLookDir(p);
        if(document.pointerLockElement === renderer.domElement){
            if (p.obj.playerType === 'FPS') {
                const eye = getEyePos(p);
                camera.position.copy(eye); camera.lookAt(eye.clone().add(lookDir));
            } else {
                const camD = p.obj.playerParams.camDist, camH = p.obj.playerParams.camHeight;
                const targetPos = new THREE.Vector3(p.body.position.x, p.body.position.y + camH, p.body.position.z);
                camera.position.copy(targetPos.clone().add(lookDir.clone().multiplyScalar(-camD)));
                camera.lookAt(targetPos);
            }
        }
    }
  } else { updateEditorCamera(dt); }
  if (isPlaying && mainSceneCamera) {
      mainSceneCamera.cam.position.copy(mainSceneCamera.mesh.position);
      mainSceneCamera.cam.quaternion.copy(mainSceneCamera.mesh.quaternion);
      renderer.render(scene, mainSceneCamera.cam);
  } else renderer.render(scene, activeCamera);
}
window.addEventListener('resize', () => { camera.aspect = viewport.clientWidth/viewport.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(viewport.clientWidth, viewport.clientHeight); });
animate(); addObject('cube');
</script>
